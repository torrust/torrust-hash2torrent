[package]
default-run = "torrust-hash2torrent"
edition = "2021"
name = "torrust-hash2torrent"
version = "0.1.0"

[dependencies]
anyhow = "1.0.86"
axum = "0.8"
axum-server = "0.8"
binascii = "0"
bytes = "1.7.1"
camino = "1.1.9"
futures-util = "0.3.30"
http-body = "1.0.0"
hyper = { version = "1.3.1", features = ["client"] }
hyper-util = { version = "0.1.3", features = ["http1", "http2", "tokio"] }
librqbit = "8"
pin-project-lite = "0.2.14"
reqwest = "0.12.7"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.37.0", features = ["rt-multi-thread"] }
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["timeout", "trace"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
